[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "sakura-community"
version = "0.1.0"
description = "Portable community training, Qwen3.5 LoRA and reproducible MoE experiments for Agora"
requires-python = ">=3.11,<3.13"
license = "Apache-2.0"
dependencies = [
  "torch==2.10.0",
  "transformers==5.9.0",
  "huggingface-hub==1.5.0",
  "safetensors==0.7.0",
  "cryptography==50.0.2",
  "psutil==7.2.2",
]

[project.optional-dependencies]
test = ["pytest==9.0.2", "peft==0.21.2"]
p2p = ["hivemind @ git+https://github.com/learning-at-home/hivemind.git@4d5c41495be082490ea44cce4e9dd58f9926bb4e"]

[project.scripts]
sakura = "sakura.cli:main"
sakura-inference = "sakura.inference_cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
