name: Sakura community tests
on:
  pull_request:
    paths: ['sakura/**', 'sakura_cli.py', 'sakura_inference.py', '.github/workflows/sakura-tests.yml']
  push:
    paths: ['sakura/**', 'sakura_cli.py', 'sakura_inference.py', '.github/workflows/sakura-tests.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  portable-cpu:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-14]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install CPU PyTorch
        if: runner.os != 'macOS'
        run: python -m pip install torch==2.10.0 --index-url https://download.pytorch.org/whl/cpu
      - name: Install community package
        run: python -m pip install -e "./sakura[test]"
      - name: Test real hybrid model, signed RPC, recovery and data tooling
        run: python -m pytest -c sakura/pyproject.toml -q
      - name: Certify real CPU adapter updates
        run: python sakura_cli.py doctor --device cpu --certify --output sakura/cpu-certification.json
      - name: Independent worker processes and restart
        run: python sakura/scripts/smoke_network.py --directory sakura/runs/ci-network
